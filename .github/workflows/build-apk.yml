
name: Hospital Appointment Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase configuration
        shell: bash
        env:
          ENV_FILE: ${{ secrets.FIREBASE_ENV_B64 }}
          GOOGLE_FILE: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          set -e

          test -n "$ENV_FILE"
          test -n "$GOOGLE_FILE"
          test -n "$FIREBASE_OPTIONS"

          printf '%s' "$ENV_FILE" | base64 --decode > .env
          printf '%s' "$GOOGLE_FILE" | base64 --decode > android/app/google-services.json
          printf '%s' "$FIREBASE_OPTIONS" | base64 --decode > lib/firebase_options.dart

          test -s .env
          test -s android/app/google-services.json
          test -s lib/firebase_options.dart

          echo "Firebase configuration restored."

      - name: Install dependencies
        run: flutter pub get

      - name: Build testing APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-appointment-testing-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

