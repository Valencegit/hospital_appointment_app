name: appointmentapp
description: "CarePulse Hospital — appointment booking and patient management application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1

  # Google Sign-In
  google_sign_in: ^6.2.2

  # State Management
  provider: ^6.1.2

  # Declarative Navigation & Routing
  go_router: ^14.3.0

  # Typography & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  # Local notifications (foreground FCM display)
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0

  # Local Persistence & Utilities
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  flutter_dotenv: ^5.2.1
  bootstrap_icons: ^1.11.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
